<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Gratulerer, Jan Fredrik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e3e3df; --ink:#141414; --muted:#5d5d58; --accent:#ec6a2c; --purple:#6f66c6; --paper:#f4f4f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 48px; overflow-x:hidden;
  }
  .stage{
    width:min(560px,100%); aspect-ratio:1/1; position:relative;
    perspective:2200px; margin-top:8px;
  }
  .face{
    position:absolute; inset:0; border-radius:14px; overflow:hidden;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.08);
  }
  .face img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .inside{background:var(--paper)}
  .inside img{opacity:0;transform:scale(.97);transition:opacity .6s ease .5s, transform .8s ease .5s}
  .open .inside img{opacity:1;transform:none}
  .cover{
    transform-origin:left center; transform-style:preserve-3d;
    transition:transform 1.4s cubic-bezier(.6,.05,.25,1), opacity .5s ease 1.1s;
    z-index:2;
  }
  .open .cover{transform:rotateY(-115deg);opacity:0;pointer-events:none}

  .hotspot{
    position:absolute; left:69.5%; top:66.5%; width:29.5%; height:29.5%;
    border-radius:50%; border:0; background:transparent; cursor:pointer;
  }
  .hotspot::after{
    content:""; position:absolute; inset:-4%; border-radius:50%;
    border:3px solid var(--accent); opacity:0; animation:pulse 2.2s ease-out infinite;
  }
  .hotspot:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
  @keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}

  .hint{margin-top:18px;color:var(--muted);font-size:15px;text-align:center}
  .hint b{color:var(--ink)}

  /* lock sheet */
  .lock{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(20,20,20,.45); backdrop-filter:blur(4px); padding:16px;
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:10;
  }
  .lock.show{opacity:1;pointer-events:auto}
  .panel{
    width:min(380px,100%); background:var(--paper); border-radius:18px; padding:26px 22px 22px;
    box-shadow:0 20px 50px -10px rgba(0,0,0,.4); text-align:center;
    transform:translateY(12px); transition:transform .25s ease;
  }
  .lock.show .panel{transform:none}
  .panel h2{font-size:22px;font-weight:800;margin-bottom:6px}
  .panel p{color:var(--muted);font-size:15px;margin-bottom:16px;line-height:1.4}
  .panel input{
    width:100%; font:inherit; font-size:17px; padding:13px 14px; border-radius:12px;
    border:2px solid #cfcfca; background:#fff; color:var(--ink); outline:none; text-align:center;
  }
  .panel input:focus{border-color:var(--ink)}
  .panel .err{color:#c0392b;font-size:14px;min-height:20px;margin:8px 0 4px}
  .btn{
    width:100%; font:inherit; font-weight:800; font-size:17px; padding:13px 16px;
    border:0; border-radius:12px; background:var(--ink); color:var(--accent); cursor:pointer;
  }
  .btn:disabled{opacity:.6;cursor:wait}
  .link{background:none;border:0;font:inherit;color:var(--muted);margin-top:10px;cursor:pointer;font-size:14px;text-decoration:underline}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* code box */
  .codebox{
    width:min(560px,100%); margin-top:22px; background:var(--paper); border-radius:16px;
    padding:20px; text-align:center; display:none;
    box-shadow:0 10px 30px -18px rgba(0,0,0,.35);
  }
  .codebox.show{display:block;animation:rise .6s ease 1.2s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .codebox .label{font-weight:800;font-size:15px;margin-bottom:8px}
  .code{
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:clamp(18px,5.4vw,26px);
    letter-spacing:.06em; font-weight:700; background:var(--purple); color:#fff;
    padding:12px 14px; border-radius:10px; word-break:break-all; user-select:all;
  }
  .codebox .btn{margin-top:12px;background:var(--ink);color:#fff}
  .codebox small{display:block;color:var(--muted);margin-top:12px;font-size:13px;line-height:1.45}

  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
  @media (prefers-reduced-motion: reduce){
    .cover,.inside img,.codebox.show{transition:none;animation:none}
    .hotspot::after{animation:none;opacity:.8}
  }
</style>
</head>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const pwBytes = new TextEncoder().encode(pw.normalize("NFC").trim().toLowerCase());
  const salt=b64(PAYLOAD.salt), iv=b64(PAYLOAD.iv), ct=b64(PAYLOAD.ct);
  let plain;
  if(window.crypto && crypto.subtle && window.isSecureContext !== false){
    try{
      const base = await crypto.subtle.importKey("raw", pwBytes, "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:PAYLOAD.iter, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      plain = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct));
    }catch(e){ if(e && e.name === "OperationError") throw new Error("wrong"); plain = null; }
  }
  if(!plain){
    await new Promise(r=>setTimeout(r,30));
    plain = FB.gcmDecrypt(FB.pbkdf2(pwBytes, salt, PAYLOAD.iter), iv, ct);
  }
  try{ return JSON.parse(new TextDecoder().decode(plain)); }catch(e){ throw new Error("wrong"); }
}

const lock = $("lock");
function showLock(){ lock.classList.add("show"); setTimeout(()=>$("pw").focus(), 60); }
function hideLock(){ lock.classList.remove("show"); }
$("openBtn").addEventListener("click", showLock);
$("openBtn2").addEventListener("click", showLock);
$("cancel").addEventListener("click", hideLock);
lock.addEventListener("click", e => { if(e.target === lock) hideLock(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") hideLock(); });

$("panel").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("pw").value;
  if(!pw){ return; }
  $("unlock").disabled = true; $("unlock").textContent = "Åpner…"; $("err").textContent = "";
  try{
    const data = await decrypt(pw);
    $("insideImg").src = "data:image/jpeg;base64," + data.img;
    $("code").textContent = data.code;
    await $("insideImg").decode().catch(()=>{});
    hideLock();
    $("hint").style.display = "none";
    requestAnimationFrame(()=> $("stage").classList.add("open"));
    $("codebox").classList.add("show");
    setTimeout(confetti, 700);
  }catch(err){
    console.error(err);
    $("err").textContent = (err && err.message === "wrong") ? "Feil passord – prøv igjen 🙂" : "Noe gikk galt – prøv å åpne siden i Safari eller Chrome.";
    const p = $("panel"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
    $("pw").select();
  }finally{
    $("unlock").disabled = false; $("unlock").textContent = "Åpne kortet";
  }
});

$("copyBtn").addEventListener("click", async () => {
  const txt = $("code").textContent;
  try{ await navigator.clipboard.writeText(txt); $("copyBtn").textContent = "Kopiert ✓"; }
  catch{ const r=document.createRange(); r.selectNodeContents($("code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $("copyBtn").textContent = "Marker og kopier"; }
  setTimeout(()=> $("copyBtn").textContent = "Kopier koden", 2200);
});

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const colors = ["#ec6a2c","#6f66c6","#141414","#f2e94e","#8fd3e8","#ffffff"];
  const parts = Array.from({length:160}, () => ({
    x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*.35,
    vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
    w:6+Math.random()*6, h:8+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*.3,
    col:colors[Math.random()*colors.length|0]
  }));
  let t = 0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++t < 240) requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}
